aid: lablabee
name: LabLabee
description: >-
  LabLabee is an AI-powered enablement, testing and troubleshooting platform for telecom
  teams, positioning itself as "the Copilot for Telco Engineers." The platform delivers on-demand,
  hands-on labs, sandboxes, learning paths and skill tests covering 4G/5G and Open RAN, IMS, network
  OAM, SDN and IP networking, telco cloud (OpenStack, OpenShift, Kubernetes, Docker), DevOps and
  GitOps automation (Terraform, Ansible, CI/CD), Linux, IAM and cybersecurity, and Industry 4.0 and
  IoT. Three AI capabilities sit on top of the lab catalog: AI Ask (search across telecom standards,
  vendor documentation and enterprise knowledge), AI Test (automated test execution and configuration
  validation) and AI Troubleshoot (automated trace analysis and root-cause identification). LabLabee
  serves telcos, universities, system integrators, network vendors and industrial private-network
  operators. Founded by Samir Tahraoui (CEO) and Mahfoud S. A. Mebarek (CPO), the company is backed by
  Accel, Kima Ventures, Reach Capital, Brighteye Ventures and 500 Global, and has been recognized as
  Best Telecom Startup by the World Communication Awards and with the TM Forum Growth Challenge Award.
  As of this enrichment pass LabLabee publishes no public developer program - no API documentation,
  API reference, OpenAPI, SDKs, CLI or public package artifacts were found on any of its surfaces.
